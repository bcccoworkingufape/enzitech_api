spring.application.name=enzitech
spring.config.import=optional:file:.env[.properties]

# Server configuration
server.port=8080

# Database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
# Alterações de banco são feitas por migrations versionadas em src/main/resources/db/migration
# validate garante que a aplicacao nao sobe se as entidades e o schema real divergirem.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
# baseline-on-migrate: o banco existente de producao ja tem o schema criado. 
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema existente antes da adocao do Flyway

# Mail configuration
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS}
api.mail.from=${MAIL_FROM}
api.frontend.url=${FRONTEND_URL}

# JWT configuration
api.security.token.secret=${JWT_SECRET}

# Deactivate SpringDoc's default response messages
springdoc.api-docs.enabled=true
springdoc.override-with-generic-response=false

# Logging configuration
logging.level.br.edu.ufape.enzitech=INFO
